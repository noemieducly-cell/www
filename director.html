<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Director | NOEMIE DUCLY</title>
  <link rel="icon" type="image/png" href="assets/favicon/Group 1.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="nav-logo">Noemie Ducly</a>
    <nav>
      <ul class="nav-links">
        <li><a href="directors.html" class="active">Work</a></li>
        <li><a href="about.html" class="hide-mobile">About</a></li>
      </ul>
    </nav>
    <a href="contact.html" class="nav-contact">Contact</a>
  </header>

  <div class="page">
    <div class="director-header">
      <h1 class="director-name" id="director-name">—</h1>
      <div class="director-tags" id="director-tags"></div>
    </div>

    <div class="filter-bar" id="filter-bar"></div>
    <div class="projects-grid" id="projects-grid"></div>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 Noemie Ducly</p>
    <p><a href="directors.html" style="opacity:.4;transition:.3s" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.4">&larr; All Talent</a></p>
  </footer>

  <script src="data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const director = getDirector(slug);

    if (!director) {
      document.getElementById('director-name').textContent = 'Not found';
    } else {
      document.title = director.name + ' | NOEMIE DUCLY';
      document.getElementById('director-name').textContent = director.name;

      // Tags
      const tagsEl = document.getElementById('director-tags');
      director.tags.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = tag;
        tagsEl.appendChild(span);
      });

      // Filter bar
      const allCats = ['All', ...new Set(director.projects.map(p => p.category))];
      let current = 'All';
      const filterBar = document.getElementById('filter-bar');

      allCats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (cat === 'All' ? ' active' : '');
        btn.textContent = cat;
        btn.addEventListener('click', () => {
          current = cat;
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderProjects();
        });
        filterBar.appendChild(btn);
      });

      // Projects grid
      function renderProjects() {
        const grid = document.getElementById('projects-grid');
        grid.innerHTML = '';
        const filtered = current === 'All'
          ? director.projects
          : director.projects.filter(p => p.category === current);

        filtered.forEach(project => {
          const card = document.createElement('div');
          card.className = 'project-card';

          const targetPage = project.type === 'photo' ? 'photo.html' : 'video.html';
          const href = targetPage + '?slug=' + project.slug;

          card.innerHTML = `
            <a href="${href}">
              <div class="project-thumb">
                <div class="project-placeholder"></div>
                <video class="project-preview" muted playsinline loop>
                  <source src="${director.localVideo || ''}" type="video/mp4" />
                </video>
              </div>
              <div class="project-info-overlay">
                <span class="project-client">${project.client}</span>
                <span class="project-title">${project.title}</span>
              </div>
            </a>
          `;

          // Hover: play/pause video
          const video = card.querySelector('.project-preview');
          card.addEventListener('mouseenter', () => {
            if (video.src) video.play().catch(() => {});
          });
          card.addEventListener('mouseleave', () => {
            video.pause();
            video.currentTime = 0;
          });

          grid.appendChild(card);
        });
      }

      renderProjects();
    }
  </script>
</body>
</html>
