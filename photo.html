<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography | NOEMIE DUCLY</title>
  <link rel="icon" type="image/png" href="assets/favicon/Group 1.png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { overflow: hidden; background: #000; }

    .photo-player {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .photo-img {
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .photo-img.loaded { opacity: 1; }

    /* Placeholder when no image */
    .photo-placeholder {
      width: 80vw;
      max-width: 1000px;
      aspect-ratio: 3/2;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-placeholder span {
      font-size: 11px;
      letter-spacing: 0.12em;
      opacity: 0.2;
      text-transform: uppercase;
      font-family: 'NB International Pro', Helvetica, Arial, sans-serif;
      color: #fff;
    }

    .photo-ui {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 32px;
      pointer-events: none;
    }

    .photo-ui > * { pointer-events: auto; }

    .photo-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffffff;
      mix-blend-mode: difference;
    }

    .photo-close {
      font-size: 11px;
      letter-spacing: 0.14em;
      opacity: 0.6;
      cursor: pointer;
      transition: opacity 0.3s;
      text-transform: uppercase;
      font-family: 'NB International Pro', Helvetica, Arial, sans-serif;
      background: none;
      border: none;
    }

    .photo-close:hover { opacity: 1; }

    .photo-brand {
      font-size: 11px;
      letter-spacing: 0.14em;
      opacity: 0.3;
      text-transform: uppercase;
      font-family: 'NB International Pro', Helvetica, Arial, sans-serif;
    }

    .photo-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .photo-meta { display: flex; flex-direction: column; gap: 4px; }

    .photo-director-label {
      font-size: 11px;
      letter-spacing: 0.1em;
      opacity: 0.45;
      text-transform: uppercase;
      font-family: 'NB International Pro', Helvetica, Arial, sans-serif;
      color: #fff;
    }

    .photo-title {
      font-size: 18px;
      letter-spacing: 0.04em;
      font-weight: 300;
      text-transform: uppercase;
      font-family: 'NB International Pro', Helvetica, Arial, sans-serif;
      color: #fff;
    }

    .photo-nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .photo-nav-btn {
      font-size: 18px;
      opacity: 0.5;
      cursor: pointer;
      transition: opacity 0.3s;
      background: none;
      border: none;
      color: #fff;
      font-family: 'NB International Pro', Helvetica, Arial, sans-serif;
      padding: 4px 8px;
    }

    .photo-nav-btn:hover { opacity: 1; }

    .photo-counter {
      font-size: 11px;
      letter-spacing: 0.12em;
      opacity: 0.4;
      text-transform: uppercase;
      font-family: 'NB International Pro', Helvetica, Arial, sans-serif;
      color: #fff;
      min-width: 60px;
      text-align: center;
    }

    .photo-overview-btn {
      font-size: 11px;
      letter-spacing: 0.12em;
      opacity: 0.45;
      cursor: pointer;
      transition: opacity 0.3s;
      background: none;
      border: none;
      color: #fff;
      font-family: 'NB International Pro', Helvetica, Arial, sans-serif;
      text-transform: uppercase;
    }

    .photo-overview-btn:hover { opacity: 1; }

    /* Overview grid */
    .photo-overview {
      position: fixed;
      inset: 0;
      background: #000;
      overflow-y: auto;
      padding: 80px 32px 40px;
      display: none;
    }

    .photo-overview.visible { display: block; }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }

    .overview-thumb {
      aspect-ratio: 3/2;
      background: #111;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s;
    }

    .overview-thumb:hover { opacity: 0.7; }

    .overview-thumb span {
      font-size: 10px;
      letter-spacing: 0.1em;
      opacity: 0.2;
      font-family: 'NB International Pro', Helvetica, Arial, sans-serif;
      color: #fff;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="photo-player" id="photo-player">
    <div class="photo-placeholder" id="photo-placeholder">
      <span>Photography</span>
    </div>
  </div>

  <div class="photo-ui">
    <div class="photo-top">
      <button class="photo-close" id="btn-close">&#8592; Close</button>
      <span class="photo-brand">Noemie Ducly</span>
      <button class="photo-overview-btn" id="btn-overview">Overview</button>
    </div>
    <div class="photo-bottom">
      <div class="photo-meta">
        <span class="photo-director-label" id="photo-director">&nbsp;</span>
        <span class="photo-title" id="photo-title">&nbsp;</span>
      </div>
      <div class="photo-nav">
        <button class="photo-nav-btn" id="btn-prev">&#8592;</button>
        <span class="photo-counter" id="photo-counter">1 of 1</span>
        <button class="photo-nav-btn" id="btn-next">&#8594;</button>
      </div>
    </div>
  </div>

  <!-- Overview -->
  <div class="photo-overview" id="photo-overview">
    <div class="overview-grid" id="overview-grid"></div>
  </div>

  <script src="data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const result = getProject(slug);

    const btnClose = document.getElementById('btn-close');
    const btnOverview = document.getElementById('btn-overview');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const counter = document.getElementById('photo-counter');
    const photoDirector = document.getElementById('photo-director');
    const photoTitle = document.getElementById('photo-title');
    const overviewEl = document.getElementById('photo-overview');
    const overviewGrid = document.getElementById('overview-grid');

    // For demo: simulate 3 images in a gallery
    let images = ['1', '2', '3'];
    let currentIndex = 0;

    if (result) {
      const { director, project } = result;
      document.title = director.name + ' | ' + project.client + ' | NOEMIE DUCLY';
      photoDirector.textContent = director.name;
      photoTitle.textContent = project.client + (project.title ? ' \u2014 ' + project.title : '');

      // Build overview thumbnails (placeholder)
      images.forEach((_, i) => {
        const thumb = document.createElement('div');
        thumb.className = 'overview-thumb';
        thumb.innerHTML = '<span>' + project.client + ' ' + (i + 1) + '</span>';
        thumb.addEventListener('click', () => {
          currentIndex = i;
          updateCounter();
          overviewEl.classList.remove('visible');
        });
        overviewGrid.appendChild(thumb);
      });
    }

    function updateCounter() {
      counter.textContent = (currentIndex + 1) + ' of ' + images.length;
    }

    updateCounter();

    btnPrev.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      updateCounter();
    });

    btnNext.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % images.length;
      updateCounter();
    });

    btnOverview.addEventListener('click', () => {
      overviewEl.classList.toggle('visible');
      btnOverview.textContent = overviewEl.classList.contains('visible') ? 'Close' : 'Overview';
    });

    btnClose.addEventListener('click', () => {
      if (overviewEl.classList.contains('visible')) {
        overviewEl.classList.remove('visible');
        btnOverview.textContent = 'Overview';
      } else if (document.referrer) {
        history.back();
      } else {
        window.location.href = 'directors.html';
      }
    });

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') btnPrev.click();
      if (e.key === 'ArrowRight') btnNext.click();
      if (e.key === 'Escape') btnClose.click();
    });
  </script>
</body>
</html>
