</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <a href="index.html" class="nav-logo">Noemie Ducly</a>
    <nav>
      <ul class="nav-links">
        <li><a href="work.html">Work</a></li>

      </ul>
    </nav>
    <button class="nav-contact" onclick="navigator.clipboard.writeText('noemie.ducly@gmail.com').then(()=>{this.textContent='Copied !';setTimeout(()=>this.textContent='noemie.ducly@gmail.com',1500)})">noemie.ducly@gmail.com</button>
  </header>

  <!-- HERO -->
  <section class="hero">
    <!-- One persistent <video> per clip, all preloaded once. Only the active one plays. -->
    <div class="hero-videos" id="hero-videos"></div>
    <div class="hero-content">
      <div>
        <h2 class="hero-title">
          <a href="project.html?slug=to-make-metal" id="hero-link">To Make &mdash; Graduation project</a>
        </h2>
      </div>
      <div class="hero-dots" id="hero-dots"></div>
    </div>
  </section>

  <!-- PROJECT GALLERY -->
  <section class="works-section">
    <div class="works-grid" id="works-grid"></div>
    <div class="works-more">
      <a href="work.html" class="works-more-btn">See more +</a>
    </div>
  </section>

  <footer class="work-page-footer">
    <span>2026 Noemie Ducly</span>
    <span>Paris &mdash; France</span>
  </footer>

  <script src="data.js"></script>
  <script>
    // Seeded shuffle — fixed order across reloads
    function seededShuffle(arr, seed) {
      const a = [...arr];
      let s = seed;
      for (let i = a.length - 1; i > 0; i--) {
        s = (s * 1664525 + 1013904223) & 0xffffffff;
        const j = Math.abs(s) % (i + 1);
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ── Hero slideshow ──
    // One <video> per clip, all created & preloaded once. We never call load()
    // again during playback — switching is just pause/play + opacity, so no jank
    // and no white cut. Each clip restarts from 0 when it becomes visible.
    const heroProjects = seededShuffle(
      FEATURED_PROJECTS.filter(p => p.video && !p.slides && p.slug !== 'off-the-room-2' && p.slug !== 'chicken-shop-date'),
      Date.now()
    ).slice(0, 5);

    const heroLink      = document.getElementById('hero-link');
    const heroDirector  = document.getElementById('hero-director');
    const dotsContainer = document.getElementById('hero-dots');
    const videosWrap    = document.getElementById('hero-videos');

    let heroIndex = 0;
    let heroTimer = null;
    const seen    = new Set();
    const SLIDE_MS = 6000; // ms each slide is shown

    // Create one persistent <video> per project.
    // Safari only autoplays inline video when `muted` / `playsinline` are present
    // as REAL attributes (the JS properties alone are not enough), so we set both.
    // Crucially we DON'T load all clips at once: Safari throttles simultaneous
    // media loads and then none of them finish. We load lazily — only the current
    // clip eagerly, and pre-load the next one just before it's needed.
    const heroVideos = heroProjects.map((p, i) => {
      const v = document.createElement('video');
      v.className    = 'hero-video';
      v.muted        = true;
      v.defaultMuted = true;
      v.loop         = true;
      v.playsInline  = true;
      v.setAttribute('muted', '');
      v.setAttribute('loop', '');
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', '');
      // Filet de securite : si la lecture echoue (Safari a court de decodeurs),
      // l'affiche du projet reste visible au lieu d'un fond noir.
      if (p.image) v.poster = p.image;
      // Safari honore l'autoplay declaratif plus fiablement qu'un play() differe.
      if (i === 0) v.setAttribute('autoplay', '');
      v.preload = i === 0 ? 'auto' : 'none'; // only the first buffers up front
      v.src = p.video;
      v.style.opacity = i === 0 ? '1' : '0';
      videosWrap.appendChild(v);
      return v;
    });

    // Tell a clip to start buffering (only once)
    function ensureLoaded(v) {
      if (v.preload !== 'auto') {
        v.preload = 'auto';
        v.load();
      }
    }

    // Robustly start a clip from the beginning — Safari often isn't ready on the
    // first play() call, so retry once the element signals it can play.
    //
    // Safari specifics (Chrome/Firefox are far more forgiving):
    //  - assigning currentTime starts a seek, and a play() issued during that
    //    seek is rejected with AbortError. We therefore only rewind when the
    //    clip isn't already at the start.
    //  - play() rejections must NOT be swallowed: when Safari runs out of video
    //    decoders (several 4K clips at once) this is the only symptom. We log it
    //    and retry, rather than failing silently on a black background.
    function activate(v) {
      ensureLoaded(v);

      const play = (essai = 0) => {
        const p = v.play();
        if (!p) return;
        p.catch(err => {
          if (err && err.name === 'NotAllowedError') return; // autoplay refuse
          if (essai < 2) {
            v.addEventListener('canplaythrough', () => play(essai + 1), { once: true });
          } else {
            console.warn('[hero] lecture impossible :', v.currentSrc, err && err.name);
            v.dispatchEvent(new CustomEvent('hero-echec', { bubbles: true }));
          }
        });
      };

      const start = () => {
        if (v.currentTime > 0.05) {
          // On attend la fin du seek avant de lancer play(), sinon Safari annule.
          v.addEventListener('seeked', () => play(), { once: true });
          try { v.currentTime = 0; } catch (e) { play(); }
        } else {
          play();
        }
      };

      if (v.readyState >= 2) {        // HAVE_CURRENT_DATA or better
        start();
      } else {
        v.addEventListener('canplay', start, { once: true });
      }
    }

    // Build dots
    heroProjects.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'hero-dot';
      dot.innerHTML = '<span class="hero-dot-fill"></span>';
      dot.addEventListener('click', () => goTo(i));
      dotsContainer.appendChild(dot);
    });

    // Update dot progress indicators
    function syncDots(index) {
      if (index === 0) seen.clear();
      seen.add(index);
      document.querySelectorAll('.hero-dot').forEach((d, i) => {
        d.classList.remove('active');
        const fill = d.querySelector('.hero-dot-fill');
        fill.style.animation = 'none';
        fill.offsetHeight; // force reflow to restart animation
        fill.style.animation = '';
        if (i === index)      d.classList.add('active');
        else if (seen.has(i)) fill.style.width = '100%';
        else                  fill.style.width = '0%';
      });
    }

    function goTo(index) {
      heroIndex = index;
      const p = heroProjects[index];

      // Update link & title
      heroLink.href        = 'project.html?slug=' + p.slug;
      heroLink.textContent = p.client + ' — ' + p.title;
      if (heroDirector) heroDirector.textContent = 'Noemie Ducly';

      // Show the active video (from the start), pause & hide the rest
      heroVideos.forEach((v, i) => {
        if (i === index) {
          v.style.opacity = '1';
          activate(v);
        } else {
          v.pause();
          v.style.opacity = '0';
        }
      });

      // Pre-buffer the NEXT clip so it's ready (but never more than ~2 at once)
      ensureLoaded(heroVideos[(index + 1) % heroVideos.length]);

      syncDots(index);

      // Reset auto-advance timer
      clearInterval(heroTimer);
      heroTimer = setInterval(() => goTo((heroIndex + 1) % heroProjects.length), SLIDE_MS);
    }

    // Start
    goTo(0);

    // ── Works grid ──
    const grid = document.getElementById('works-grid');

    // Random selection on each load — any project can appear, capped at 10
    const shuffled = seededShuffle(FEATURED_PROJECTS, Date.now()).slice(0, 10);

    function imgHtml(src, cls, alt) {
      const webp = src.replace(/\.(jpg|jpeg|png)$/i, '.webp');
      return `<picture><source srcset="${webp}" type="image/webp"><img class="${cls}" src="${src}" alt="${alt}"></picture>`;
    }

    shuffled.forEach(p => {
      const item = document.createElement('div');
      item.className = 'work-item';

      item.innerHTML = `
        <a href="project.html?slug=${p.slug}" class="work-thumb-wrap">
          <div class="work-thumb" style="${!p.image ? 'background:#000;' : ''}">
            ${p.image ? imgHtml(p.image, 'work-img', p.title) : ''}
            ${p.video ? `<video class="work-video" muted playsinline loop><source src="${p.video}" type="video/mp4" /></video>` : ''}
          </div>
        </a>
        <p class="work-label">${p.client} &mdash; ${p.title}</p>
      `;

      grid.appendChild(item);
    });

    // Show all items immediately
    document.querySelectorAll('.work-item').forEach(el => el.classList.add('visible'));
  </script>
</body>
</html>
